a.btn:active { transform: scale(.97); }
.main { background: var(--yellow); color: var(--black); }
.main:hover { background: #fff; }
.alt { border: 1px solid var(--border); color: var(--white); }
.alt:hover { border-color: var(--yellow); color: var(--yellow); }
a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
