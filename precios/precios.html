<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Servicios y precios — Mazothecoach</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Misma tipografía y paleta que la sección "Conóceme" de index.html */
:root{--lime:#D0F53B;--bg:#111;--card:#232323;--olive:#2b380c;--text:#F2F0EB;--muted:rgba(242,240,235,.62)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);width:1080px;font-family:'Barlow',sans-serif;color:var(--text)}
.sheet{width:1080px;background:var(--bg)}

.head{position:relative;height:270px;overflow:hidden;background:#000}
.head img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 0;opacity:.95}
.head::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(17,17,17,.05) 0%,rgba(17,17,17,.35) 55%,var(--bg) 100%)}
.head-in{position:absolute;left:88px;bottom:30px;z-index:2}
.tag{display:inline-block;background:var(--lime);color:#111;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:25px;letter-spacing:5px;padding:12px 32px 11px;margin-bottom:14px}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:88px;line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
h1 .k{color:var(--lime)}

main{padding:38px 88px 0}
.kicker{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:25px;letter-spacing:6px;color:var(--lime);text-transform:uppercase;margin:34px 0 18px}
.kicker:first-child{margin-top:18px}

.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:26px 34px;margin-bottom:13px;min-height:124px}
.name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:37px;line-height:1;text-transform:uppercase}
.sub{font-weight:300;font-size:22px;color:var(--muted);margin-top:8px}
.price{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:52px;line-height:1;color:var(--lime);white-space:nowrap;align-self:flex-start;margin-top:6px}
.price small{font-family:'Barlow',sans-serif;font-weight:300;font-size:26px;color:var(--muted);margin-left:8px}

.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:13px}
.pack{background:var(--olive);text-align:center;padding:26px 10px 24px}
.pack .n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:24px;letter-spacing:3.5px;text-transform:uppercase}
.pack .p{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:50px;color:var(--lime);line-height:1;margin:10px 0 8px}
.pack .u{font-weight:300;font-size:21px;color:var(--muted)}

.fine{font-weight:300;font-size:21px;line-height:1.45;color:var(--muted);margin:24px 0 18px}

.cta{display:flex;justify-content:space-between;align-items:center;background:var(--lime);color:#111;padding:26px 34px;margin:0 -0px}
.cta b{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:42px;text-transform:uppercase;line-height:1}
.cta span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:23px;line-height:1.35;text-align:right;letter-spacing:.3px}
.row.hi{background:var(--olive);outline:2px solid var(--lime);outline-offset:-2px}
.row > div:first-child{padding-right:28px}
.pad{height:60px}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <header class="head">
    <img src="header.jpg" alt="">
    <div class="head-in">
      <div class="tag">@MAZOBASTIDAS_</div>
      <h1>Servicios <span class="k">y precios</span></h1>
    </div>
  </header>
  <main id="main"></main>
  <div class="pad"></div>
</div>

<script>
/* ===== Tarifario: edita aquí y vuelve a renderizar (node render.js) ===== */
const DATA = {
  presencial: {
    titulo: 'Coaching presencial · Empire Fitness',
    sesion: { nombre: 'Sesión presencial', nota: 'Seguimiento por app Hevy · Se aparta y paga al inicio de la semana', precio: 700, unidad: '/sesión' },
    paquetes: [ { n: 10, precio: 6500 }, { n: 15, precio: 9000 }, { n: 20, precio: 11000 } ]
  },
  mensual: {
    titulo: 'Coaching mensual',
    planes: [
      { nombre: 'Online normal',   nota: 'Revisión bisemanal · Rutina personalizada · Nutrición +$400', precio: 2750 },
      { nombre: 'Híbrido normal',  nota: 'Online + presencial · Revisión bisemanal · Rutina personalizada · Nutrición +$400', precio: 3250 },
      { nombre: 'Online plus',     nota: 'Revisión semanal · Rutina personalizada · Nutrición incluida', precio: 3900 },
      { nombre: 'Híbrido plus',    nota: 'Online Plus + presencial · Revisión semanal · Rutina personalizada · Nutrición incluida', precio: 4400 },
      { nombre: 'Híbrido platino', nota: 'Sesión presencial semanal · Revisión semanal · Rutina personalizada · Nutrición incluida · Creatina al iniciar', precio: 6000, destacado: true }
    ]
  },
  programas: {
    titulo: 'Programas',
    items: [
      { nombre: 'The Come Up',           nota: 'Al terminar: 1 mes de coaching de regalo', precio: 650 },
      { nombre: 'Asesoría 1 a 1',        nota: 'Sesión única de 60 minutos',                precio: 990 },
      { nombre: 'Rutina autogestionada', nota: '8 semanas + 3 videollamadas · tú ejecutas', precio: 4000 }
    ]
  },
  letraChica: 'Precios en MXN. Conteo de calorías y macros conmigo incluido en cualquier plan. Nutrición clínica y deportiva con nutriólogos aliados. Descuento para residentes de HighTowers Elite.',
  cta: { titulo: 'Aplica hoy', lineas: ['DM: @mazobastidas_ · WhatsApp: 686 264 7140', 'mazothecoach.github.io/mazothecoach'] }
};

const $ = n => '$' + n.toLocaleString('en-US');
const row = (it, unidad = '') => `
  <div class="row${it.destacado ? ' hi' : ''}"><div><div class="name">${it.nombre}</div><div class="sub">${it.nota}</div></div>
  <div class="price">${$(it.precio)}${unidad ? `<small>${unidad}</small>` : ''}</div></div>`;

const d = DATA, p = d.presencial;
document.getElementById('main').innerHTML = `
  <div class="kicker">${p.titulo}</div>
  ${row(p.sesion, p.sesion.unidad)}
  <div class="packs">${p.paquetes.map(k => `
    <div class="pack"><div class="n">${k.n} sesiones</div><div class="p">${$(k.precio)}</div>
    <div class="u">${$(Math.round(k.precio / k.n))} por sesión</div></div>`).join('')}</div>
  <div class="kicker">${d.mensual.titulo}</div>
  ${d.mensual.planes.map(it => row(it, '/mes')).join('')}
  <div class="kicker">${d.programas.titulo}</div>
  ${d.programas.items.map(it => row(it)).join('')}
  <p class="fine">${d.letraChica}</p>
  <div class="cta"><b>${d.cta.titulo}</b><span>${d.cta.lineas.join('<br>')}</span></div>`;
</script>
</body>
</html>
